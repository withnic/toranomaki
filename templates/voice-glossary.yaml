# 音声入力の誤認識辞書（ユーザー単位・全プロジェクト共通）
# Claude が会話中に誤認識を読み替えるたびに追記して育てる。最初は空でも構わない。
#   term:         正しい表記（意図していた語）
#   aliases:      実際に出てきた誤認識
#   context_only: true = 一般語と衝突するので機械的に置き換えない（Claude だけが文脈で読み替える）
#   note:         どういう文脈でそう読み替えたか
terms:
  - term: "Claude Code"
    aliases: ["クロードコード"]
  - term: "不要"
    aliases: ["扶養"]
    context_only: true
    note: "「扶養なら作り直したほうが楽かな」= 不要なら。一般語の「扶養」と衝突するので置き換えない"
